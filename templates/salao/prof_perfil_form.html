{% extends "base.html" %}
{% block title %}Meu perfil{% endblock %}
{% block content %}
<div class="mx-auto" style="max-width:640px">
  <h1 class="page-title h3 mb-1">Meu perfil</h1>
  <p class="text-secondary">É isto que os clientes veem antes de agendar com você.
    <a href="{% url 'profissional_detalhe' object.pk %}">Ver como o cliente vê</a></p>
  <div class="card"><div class="card-body p-4">
    <form method="post" enctype="multipart/form-data" novalidate>
      {% csrf_token %}
      {% include "includes/form_fields.html" %}
      <div class="d-flex gap-2">
        <button class="btn btn-primary" type="submit">Salvar perfil</button>
        <a class="btn btn-outline-secondary" href="{% url 'prof_agenda' %}">Voltar</a>
      </div>
    </form>
  </div></div>
</div>
{% endblock %}
